<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emertxe – Batch Analytics Prototype</title>
<style>
  :root{
    --ink:#2e2e2e; --mute:#6e7377; --line:#e3e6ea;
    --brand:#cc0066; --brand-d:#663399;
    --blue:#1b6ec2; --blue-d:#1559a0;
    --green:#1e8e4e; --green-bg:#e7f4ec;
    --amber:#c77a0a; --amber-bg:#fdf2e0;
    --red:#c0392b; --red-bg:#fbeceb;
    --gold:#b8860b; --gold-bg:#fbf2d9;
    --card:#fff; --page1:#dbeef2; --page2:#eaf3e6; --page3:#f6f0dc;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink);
    background:
      radial-gradient(1200px 500px at 88% -8%, var(--page3) 0%, rgba(246,240,220,0) 60%),
      linear-gradient(120deg, var(--page1) 0%, #eef4f3 42%, var(--page2) 100%);
    min-height:100vh; padding-bottom:60px; }

  .topnav{ display:flex; align-items:center; gap:26px; padding:14px 30px; background:#fff; border-bottom:1px solid var(--line); box-shadow:0 1px 2px rgba(0,0,0,.03); position:sticky; top:0; z-index:20; }
  .logo{ height:32px; width:auto; display:block; cursor:pointer; }
  .topnav a{ font-size:13.5px; color:#5a6066; text-decoration:none; padding:6px 2px; cursor:pointer; }
  .topnav a:hover{ color:var(--ink); }
  .topnav a.active{ color:#12395f; font-weight:700; border-bottom:2.5px solid var(--blue); padding-bottom:15px; margin-bottom:-16px; }
  .topnav .spacer{ flex:1; }
  .topnav .ico{ width:34px; height:34px; border-radius:50%; background:#eef1f4; display:inline-flex; align-items:center; justify-content:center; color:#8a9097; font-size:15px; }
  .topnav .ava{ width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--brand),var(--brand-d)); }

  .crumbbar{ max-width:1180px; margin:16px auto 0; padding:0 22px; }
  .crumb{ font-size:12.5px; color:var(--mute); }
  .crumb a{ color:var(--blue); text-decoration:none; cursor:pointer; } .crumb a:hover{ text-decoration:underline; }
  .crumb b{ color:#3a3f44; }

  .wrap{ max-width:1180px; margin:12px auto 0; padding:0 22px; }
  .shell{ background:var(--card); border-radius:14px; box-shadow:0 8px 30px rgba(30,50,70,.08); padding:26px 28px 32px; }

  h1{ font-size:26px; font-weight:800; letter-spacing:-.2px; } h1 .accent{ color:var(--brand); }
  .sub{ font-size:13.5px; color:var(--mute); margin:4px 0 22px; }
  .sec-label{ font-size:11px; letter-spacing:.7px; text-transform:uppercase; color:var(--mute); font-weight:700; margin:0 2px 12px; display:flex; align-items:center; gap:8px; }
  .sec-label::before{ content:""; width:4px; height:14px; background:var(--brand); border-radius:2px; }
  .sec-label .subx{ color:#b3b9bf; font-weight:400; text-transform:none; letter-spacing:0; }
  .divider{ height:1px; background:var(--line); margin:26px 0 22px; }

  .pill{ display:inline-block; padding:3px 11px; border-radius:20px; font-size:11.5px; font-weight:600; }
  .pill-course{ background:#f0ecf6; color:var(--brand-d); }
  .mode-online{ background:#e6f0fb; color:#1559a0; } .mode-offline{ background:#eef7ee; color:#2f7d32; }
  .type-regular{ background:#eef1f4; color:#5a6066; } .type-int{ background:#f0ecf6; color:#663399; } .type-wp{ background:#fdeaf3; color:#b5195f; }
  .pill-date{ background:#f4f6f8; color:#5a6066; } .pill-completed{ background:#eef1f4; color:#5a6066; }
  .st{ display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:20px; font-size:11.5px; font-weight:700; white-space:nowrap; }
  .st::before{ content:""; width:7px; height:7px; border-radius:50%; }
  .st-g{ background:var(--green-bg); color:var(--green);} .st-g::before{ background:var(--green);}
  .st-a{ background:var(--amber-bg); color:var(--amber);} .st-a::before{ background:var(--amber);}
  .st-r{ background:var(--red-bg); color:var(--red);} .st-r::before{ background:var(--red);}
  .st-n{ background:#eef1f4; color:#8a9097;} .st-n::before{ background:#b3b9bf;}
  .muted{ color:#b3b9bf; }
  .dnum{ font-weight:700; white-space:nowrap; } .dnum.ontime{ color:var(--green);} .dnum.over{ color:var(--red);}

  .tablecard{ border:1px solid var(--line); border-radius:12px; overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th{ text-align:left; padding:12px 15px; background:#f4f6f8; color:#565c62; font-weight:700; font-size:10.5px; letter-spacing:.5px; text-transform:uppercase; border-bottom:1px solid var(--line); }
  tbody td{ padding:13px 15px; border-bottom:1px solid #eef1f4; vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#f9fbfc; }
  td .bid{ font-weight:800; color:#12395f; }
  td.date{ white-space:nowrap; } td.actioncell{ white-space:nowrap; width:1%; }
  .viewbtn{ padding:8px 15px; border:1px solid var(--blue); background:#fff; color:var(--blue); border-radius:8px; font-size:12.5px; font-weight:700; cursor:pointer; transition:.15s; white-space:nowrap; }
  .viewbtn:hover{ background:var(--blue); color:#fff; } .viewbtn:disabled{ border-color:#d3d9de; color:#b3b9bf; cursor:default; }

  /* HOME */
  .tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .tile{ border:1px solid var(--line); border-radius:12px; padding:18px; background:#fff; cursor:pointer; position:relative; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.02); }
  .tile:hover{ transform:translateY(-2px); box-shadow:0 6px 18px rgba(30,50,70,.10); }
  .tile .ico{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:17px; margin-bottom:12px; }
  .tile .val{ font-size:28px; font-weight:800; line-height:1; color:#222; } .tile .lbl{ font-size:12.5px; color:var(--mute); margin-top:7px; }
  .tile .arrow{ position:absolute; top:16px; right:16px; color:#c4cbd1; font-size:13px; } .tile:hover .arrow{ color:var(--blue); }
  .ic-brand{ background:#fbe8f1; color:var(--brand);} .ic-blue{ background:#e6f0fb; color:var(--blue);} .ic-green{ background:var(--green-bg); color:var(--green);} .ic-purple{ background:#f0ecf6; color:var(--brand-d);} .ic-grey{ background:#eef1f4; color:#5a6066;}
  .tile.flag{ border-color:#f1c9c4; background:#fdf6f5;} .tile.flag .ico{ background:var(--red-bg); color:var(--red);} .tile.flag .val{ color:var(--red);}
  .searchcard{ border:1px solid var(--line); border-radius:12px; padding:20px; background:#fbfcfd; margin-bottom:22px; }
  .searchrow{ display:flex; gap:12px; }
  .searchrow input{ flex:1; padding:13px 16px; border:1px solid #cfd6dc; border-radius:9px; font-size:14px; background:#fff; outline:none; }
  .searchrow input:focus{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(27,110,194,.12); }
  .btn{ padding:13px 26px; border:none; border-radius:9px; font-size:14px; font-weight:700; cursor:pointer; }
  .btn-primary{ background:var(--blue); color:#fff; } .btn-primary:hover{ background:var(--blue-d); }
  .flabel{ font-size:11px; letter-spacing:.7px; text-transform:uppercase; color:var(--mute); margin:18px 0 9px; font-weight:700; }
  .filters{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .filters select{ padding:12px 13px; border:1px solid #cfd6dc; border-radius:9px; font-size:13px; background:#fff; color:#4a4f54; cursor:pointer; }
  .listtabs{ display:flex; gap:4px; border-bottom:2px solid var(--line); margin:6px 0 16px; }
  .ltab{ padding:11px 20px; font-size:14px; color:var(--mute); cursor:pointer; border-bottom:2.5px solid transparent; margin-bottom:-2px; font-weight:600; }
  .ltab:hover{ color:var(--ink);} .ltab.active{ color:var(--brand); border-bottom-color:var(--brand);}
  .rhead{ display:flex; justify-content:space-between; align-items:baseline; margin:4px 2px 14px; }
  .rhead .title{ font-size:16px; font-weight:800; } .rhead .title .bar{ display:inline-block; width:4px; height:16px; background:var(--brand); border-radius:2px; margin-right:9px; vertical-align:-2px; }

  .pager button:hover:not(:disabled){ border-color:var(--blue); color:var(--blue);} .pager button.on{ background:var(--blue); color:#fff; border-color:var(--blue);} .pager button:disabled{ opacity:.4; cursor:default; }
  .empty{ display:none; text-align:center; padding:30px 20px 40px; } .empty img{ width:250px; max-width:60%; height:auto; margin-bottom:4px; } .empty h2{ font-size:19px; margin:6px 0 6px; color:#3a3f44; } .empty p{ font-size:13.5px; color:var(--mute); }

  /* BATCH / MODULE header */
  .bhead{ border:1px solid var(--line); border-radius:12px; padding:20px 22px; background:linear-gradient(180deg,#fbfcfd,#fff); margin-bottom:20px; }
  .bhead .top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
  .bhead h1{ font-size:23px; margin-bottom:8px; }
  .idrow{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .curmod{ font-size:12.5px; color:var(--mute);} .curmod b{ color:#3a3f44; }
  .status-chip{ display:inline-flex; align-items:center; gap:7px; padding:8px 16px; border-radius:22px; font-size:13px; font-weight:700; white-space:nowrap; }
  .status-chip.g{ background:var(--green-bg); color:var(--green);} .status-chip.g::before{ content:""; width:8px;height:8px;border-radius:50%; background:var(--green);}
  .status-chip.a{ background:var(--amber-bg); color:var(--amber);} .status-chip.a::before{ content:""; width:8px;height:8px;border-radius:50%; background:var(--amber);}
  .people{ display:flex; gap:34px; margin-top:16px; padding-top:16px; border-top:1px solid var(--line); }
  .person .role{ font-size:10.5px; letter-spacing:.6px; text-transform:uppercase; color:var(--mute); font-weight:700; }
  .pwrap{ display:flex; align-items:center; gap:10px; margin-top:6px; }
  .pav{ width:38px; height:38px; border-radius:50%; object-fit:cover; border:1.5px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .person .name{ font-size:15px; font-weight:700; color:#333; }

  .tabs{ display:flex; gap:4px; border-bottom:2px solid var(--line); margin-bottom:20px; }
  .tab{ padding:12px 20px; font-size:14px; color:var(--mute); cursor:pointer; border-bottom:2.5px solid transparent; margin-bottom:-2px; font-weight:600; }
  .tab:hover{ color:var(--ink);} .tab.active{ color:var(--brand); border-bottom-color:var(--brand); }
  .panel{ display:none; } .panel.active{ display:block; }
  .panel-note{ font-size:12.5px; color:var(--mute); margin-bottom:14px; line-height:1.5; } .panel-note b{ color:#5a6066; }

  /* student perf */
  .filterbar{ display:flex; gap:12px; align-items:center; margin-bottom:16px; }
  .toggle{ display:flex; border:1px solid #cfd6dc; border-radius:8px; overflow:hidden; }
  .toggle span{ padding:9px 18px; font-size:13px; cursor:pointer; color:var(--mute); font-weight:600; } .toggle span.on{ background:var(--blue); color:#fff; }
  .exp{ margin-left:auto; padding:10px 16px; border:none; background:var(--green); color:#fff; border-radius:8px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .bandrow{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px; }
  .band{ border:1px solid var(--line); border-radius:12px; padding:16px 18px; position:relative; overflow:hidden; }
  .band::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; }
  .band .pct{ font-size:26px; font-weight:800; line-height:1;} .band .lbl{ font-size:12.5px; font-weight:700; margin-top:6px;} .band .cnt{ font-size:11px; color:var(--mute); margin-top:4px; }
  .band.top{ background:var(--green-bg);} .band.top::before{ background:var(--green);} .band.top .pct,.band.top .lbl{ color:var(--green);}
  .band.mid{ background:var(--amber-bg);} .band.mid::before{ background:var(--amber);} .band.mid .pct,.band.mid .lbl{ color:var(--amber);}
  .band.bot{ background:var(--red-bg);} .band.bot::before{ background:var(--red);} .band.bot .pct,.band.bot .lbl{ color:var(--red);}
  .bdot{ display:inline-block; width:11px; height:11px; border-radius:50%; }
  td .sname{ font-weight:700; color:#333;} td .sid{ font-size:11px; color:var(--mute); }
  .merit{ display:inline-flex; gap:5px; align-items:center; flex-wrap:wrap; }
  .m{ font-size:10.5px; font-weight:700; border-radius:10px; padding:2px 9px; white-space:nowrap; }
  .m-spot{ background:var(--gold-bg); color:var(--gold);} .m-ptnom{ background:#f0ecf6; color:var(--brand-d);} .m-ptsel{ background:#fdeaf3; color:var(--brand); border:1px solid #f4c2da; }

  /* review notes */
  .addnote{ border:1px solid var(--line); border-radius:12px; padding:16px; background:#fbfcfd; margin-bottom:20px; }
  .addnote textarea{ width:100%; border:1px solid #cfd6dc; border-radius:8px; padding:12px; font-size:13.5px; font-family:inherit; resize:vertical; min-height:70px; outline:none; }
  .addnote textarea:focus{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(27,110,194,.12); }
  .addnote .row{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .addnote .who{ font-size:12px; color:var(--mute);} .addnote .who b{ color:#3a3f44; }
  .addnote button{ padding:9px 18px; border:none; background:var(--brand-d); color:#fff; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; } .addnote button:hover{ background:#552a80; }
  .note-item{ border:1px solid var(--line); border-left:4px solid var(--brand); border-radius:10px; padding:14px 16px; margin-bottom:12px; background:#fff; }
  .note-item .meta{ font-size:11.5px; color:var(--mute); margin-bottom:5px;} .note-item .meta b{ color:#3a3f44; }
  .note-item .body{ font-size:13.5px; color:#3a3f44; line-height:1.55; }

  /* MODULE */
  .mhead{ border:1px solid var(--line); border-radius:12px; padding:20px 22px; background:linear-gradient(180deg,#fbfcfd,#fff); margin-bottom:20px; }
  .mtop{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
  .mhead h1{ font-size:22px; margin-bottom:6px; } .mhead .meta{ font-size:12.5px; color:var(--mute);} .mhead .meta b{ color:#3a3f44; }
  .navbtns{ margin-top:12px; display:flex; gap:8px; }
  .navbtns button{ font-size:12px; padding:7px 13px; border:1px solid #d3d9de; background:#fff; border-radius:8px; cursor:pointer; color:#5a6066; font-weight:600; } .navbtns button:hover{ border-color:var(--blue); color:var(--blue); }
  .maac-btn{ font-size:13px; padding:9px 16px; border:none; border-radius:9px; background:var(--brand-d); color:#fff; font-weight:700; cursor:pointer; } .maac-btn:hover{ background:#552a80; }
  .schedgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:26px; }
  .sc{ background:#fff; padding:14px 16px; } .sc .k{ font-size:10.5px; letter-spacing:.5px; text-transform:uppercase; color:var(--mute); font-weight:700;} .sc .v{ font-size:14.5px; font-weight:700; color:#333; margin-top:4px;} .sc .v.muted{ color:#b3b9bf; font-weight:600; }
  .mentorcell{ display:flex; align-items:center; gap:9px; margin-top:4px; } .mentorcell img{ width:30px; height:30px; border-radius:50%; object-fit:cover; border:1px solid #e3e6ea; } .mentorcell .v{ margin-top:0; }
  .kpirow{ display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:26px; }
  .kpi{ border:1px solid var(--line); border-radius:12px; padding:16px; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.02); } .kpi .kv{ font-size:23px; font-weight:800; color:#222;} .kpi .kl{ font-size:11.5px; color:var(--mute); margin-top:5px; }
  .val{ font-weight:700; color:#333; }

  /* DASHBOARD */
  .greet{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; gap:16px; }
  .greet h1{ font-size:24px; margin-bottom:4px; } .greet .sub{ font-size:13.5px; color:var(--mute); }
  .roleswitch{ text-align:right; } .roleswitch .lbl{ font-size:10.5px; letter-spacing:.6px; text-transform:uppercase; color:var(--mute); margin-bottom:6px; font-weight:700; }
  .roleswitch select{ padding:9px 13px; border:1px solid #cfd6dc; border-radius:8px; font-size:13px; background:#fff; color:#4a4f54; cursor:pointer; } .demo-hint{ font-size:11px; color:#a7adb3; margin-top:5px; }
  .glance{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
  .gt{ border:1px solid var(--line); border-radius:12px; padding:16px 18px; background:#fff;} .gt .v{ font-size:26px; font-weight:800; color:#222; line-height:1;} .gt .k{ font-size:12px; color:var(--mute); margin-top:7px;} .gt.alert .v{ color:var(--red);} .gt.alert{ border-color:#f1c9c4; background:#fdf6f5; }
  .cols{ display:grid; grid-template-columns:1.7fr 1fr; gap:20px; }
  .dpanel{ border:1px solid var(--line); border-radius:12px; background:#fff; overflow:hidden; }
  .dpanel .ph{ padding:14px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; background:#fbfcfd; }
  .dpanel .ph h2{ font-size:14.5px; color:#333; font-weight:800; display:flex; align-items:center; gap:9px; } .dpanel .ph h2::before{ content:""; width:4px; height:15px; background:var(--brand); border-radius:2px; }
  .dpanel .ph .filter{ font-size:11.5px; color:var(--mute);} .badge{ font-size:10.5px; border:1px solid #d3d9de; border-radius:10px; padding:2px 9px; color:var(--mute); font-weight:600; }
  .todo{ display:flex; align-items:flex-start; gap:12px; padding:14px 18px; border-bottom:1px solid #eef1f4; } .todo:last-child{ border-bottom:none;} .todo:hover{ background:#f9fbfc;} .todo.done{ opacity:.55; }
  .todo .body{ flex:1; } .todo .t{ font-size:13.5px; font-weight:700; color:#333;} .todo.done .t{ text-decoration:line-through; color:#999;} .todo .m{ font-size:11.5px; color:var(--mute); margin-top:3px; }
  .todo .go{ font-size:11px; color:var(--blue); font-weight:600; margin-top:5px; display:inline-block; cursor:pointer; } .todo .go:hover{ text-decoration:underline; }
  .todo .actions{ display:flex; flex-direction:column; align-items:flex-end; gap:9px; }
  .due{ font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px; white-space:nowrap; } .due.soon{ background:#eef1f4; color:#5a6066;} .due.today{ background:var(--amber-bg); color:var(--amber);} .due.over{ background:var(--red-bg); color:var(--red);} .due.esc{ background:var(--red-bg); color:var(--red); border:1px solid #eeb8b1; }
  .mc-btn2{ font-size:11.5px; font-weight:700; padding:7px 14px; border:1px solid var(--blue); background:#fff; color:var(--blue); border-radius:8px; cursor:pointer; white-space:nowrap; } .mc-btn2:hover{ background:var(--blue); color:#fff; }
  .done-tag{ font-size:11px; font-weight:700; padding:6px 12px; border-radius:12px; color:var(--green); background:var(--green-bg); white-space:nowrap; }
  .fc{ padding:13px 18px; border-bottom:1px solid #eef1f4;} .fc:last-child{ border-bottom:none;} .fc .t{ font-size:13px; font-weight:700; color:#444;} .fc .m{ font-size:11.5px; color:var(--mute); margin-top:3px; } .emptyfc{ padding:34px; text-align:center; color:#a7adb3; font-size:13px; }

  /* modal */
  .overlay{ display:none; position:fixed; inset:0; background:rgba(20,30,40,.4); align-items:center; justify-content:center; z-index:50; }
  .overlay.show{ display:flex; }
  .modal{ background:#fff; border-radius:14px; width:420px; max-width:90%; padding:24px; box-shadow:0 24px 70px rgba(0,0,0,.28); }
  .modal h3{ font-size:17px; color:#222; margin-bottom:9px; font-weight:800; } .modal p{ font-size:13px; color:var(--mute); line-height:1.55; }
  .modal .act-name{ font-size:13px; font-weight:700; color:#3a3f44; background:#f4f6f8; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:14px 0 20px; }
  .modal .mbtns{ display:flex; gap:10px; justify-content:flex-end; } .modal .cancel{ padding:10px 18px; border:1px solid #cfd6dc; background:#fff; border-radius:8px; font-size:13px; font-weight:700; color:#555; cursor:pointer; } .modal .confirm{ padding:10px 20px; border:none; background:var(--green); color:#fff; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; } .modal .confirm:hover{ background:#187a42; }

  .view{ display:none; } .view.active{ display:block; }
</style>

function hoRender(){
  const body=document.getElementById('rowsBody'); if(!body)return;
  document.getElementById('listHead').innerHTML = ho.tab==='running'?HEAD_RUN:HEAD_COMP;
  const pages=Math.max(1,Math.ceil(ho.filtered.length/ho.PER)); if(ho.page>pages)ho.page=pages;
  const start=(ho.page-1)*ho.PER, slice=ho.filtered.slice(start,start+ho.PER);
  if(ho.tab==='running'){
    body.innerHTML=slice.map(b=>`<tr><td><span class="bid">${b.id}</span></td><td>${b.course}</td><td><span class="pill mode-${b.mode.toLowerCase()}">${b.mode}</span></td><td><span class="pill type-${b.type.toLowerCase()}">${b.type}</span></td><td class="date">${b.start}</td><td>${b.cur}</td><td>${statusHTML(b.delay)}</td><td class="actioncell"><button class="viewbtn" onclick="openBatch('${b.id}')">View Batch</button></td></tr>`).join('');
  } else {
    body.innerHTML=slice.map(b=>`<tr><td><span class="bid">${b.id}</span></td><td>${b.course}</td><td><span class="pill mode-${b.mode.toLowerCase()}">${b.mode}</span></td><td class="date">${b.pStart}</td><td class="date">${b.pEnd}</td><td class="date">${b.aStart}</td><td class="date">${b.aEnd}</td><td>${delayNum(b.delay)}</td><td><span class="pill pill-completed">Completed</span></td><td class="actioncell"><button class="viewbtn" onclick="openBatch('${b.id}')">View Batch</button></td></tr>`).join('');
  }
  document.getElementById('resultsTitle').textContent=ho.heading;
  const from=ho.filtered.length?start+1:0,to=Math.min(start+ho.PER,ho.filtered.length);
  document.getElementById('pageInfo').textContent=`Showing ${from}–${to} of ${ho.filtered.length}`;
  let p=`<button ${ho.page===1?'disabled':''} onclick="hoGo(${ho.page-1})">Prev</button>`;
  for(let i=1;i<=pages;i++)p+=`<button class="${i===ho.page?'on':''}" onclick="hoGo(${i})">${i}</button>`;
  p+=`<button ${ho.page===pages?'disabled':''} onclick="hoGo(${ho.page+1})">Next</button>`;
  document.getElementById('pager').innerHTML=pages>1?p:'';
}
function hoShow(x){ document.getElementById('resultsState').style.display=x==='r'?'block':'none'; document.getElementById('emptyState').style.display=x==='e'?'block':'none'; }
function hoGo(p){ ho.page=p; hoRender(); }
function hoBase(){ return ho.tab==='running'?ALL.slice():COMPLETED.slice(); }
function hoBaseH(){ return ho.tab==='running'?"Current Running Batches":"Completed Batches"; }
function hoTab(t){ ho.tab=t; ho.page=1; document.getElementById('ltab-running').classList.toggle('active',t==='running'); document.getElementById('ltab-completed').classList.toggle('active',t==='completed'); ho.filtered=hoBase(); ho.heading=hoBaseH(); document.getElementById('search').value=''; hoShow('r'); hoRender(); }
function hoTile(key){ ho.tab='running'; document.getElementById('ltab-running').classList.add('active'); document.getElementById('ltab-completed').classList.remove('active'); let set=ALL.slice(),h="Current Running Batches";

      </div>
    </div>
    <div class="glance" id="glance"></div>
    <div class="cols">
      <div class="dpanel"><div class="ph"><h2>My To-Do <span class="badge" id="todoCount"></span></h2><span class="filter">Due first ▾</span></div><div id="todoList"></div></div>
      <div class="dpanel"><div class="ph"><h2>Forthcoming</h2><span class="filter">Next 7 days</span></div><div id="fcList"></div></div>
    </div>`;
  document.getElementById('roleSel').value=curRole; setRole(curRole);
}
function setRole(r){ curRole=r; const d=ROLES[r];
  document.getElementById('roleSub').textContent=d.sub;
  document.getElementById('glance').innerHTML=d.glance.map(g=>`<div class="gt ${g[2]?'alert':''}"><div class="v">${g[0]}</div><div class="k">${g[1]}</div></div>`).join('');
  document.getElementById('todoList').innerHTML=d.todo.map((t,i)=>`<div class="todo" id="todo-${i}"><div class="body"><div class="t">${t[0]}</div><div class="m">${t[1]}</div><span class="go" onclick="todoGo('${t[4]}')">Go to ${t[4]} →</span></div><div class="actions"><span class="due ${t[2]}">${t[3]}</span><button class="mc-btn2" onclick="askComplete(${i}, ${JSON.stringify(t[0]).replace(/"/g,'&quot;')})">Mark Complete</button></div></div>`).join('');
  document.getElementById('todoCount').textContent=d.todo.length+" pending";
  document.getElementById('fcList').innerHTML=d.fc.length?d.fc.map(f=>`<div class="fc"><div class="t">${f[0]}</div><div class="m">${f[1]}</div></div>`).join(''):'<div class="emptyfc">Nothing in the next 7 days</div>';
}
function todoGo(dest){ if(dest==='batch') openBatch('26011B'); else openModule(1); }
let pendingIdx=null;
function askComplete(i,name){ pendingIdx=i; document.getElementById('modalAct').textContent=name; document.getElementById('overlay').classList.add('show'); }
function closeModal(){ document.getElementById('overlay').classList.remove('show'); pendingIdx=null; }
function confirmComplete(){ if(pendingIdx===null)return; const row=document.getElementById('todo-'+pendingIdx); if(row){ row.classList.add('done'); row.querySelector('.actions').innerHTML='<span class="done-tag">✓ Completed</span>'; document.getElementById('todoCount').textContent=document.querySelectorAll('.todo:not(.done)').length+" pending"; } closeModal(); }
document.getElementById('overlay').addEventListener('click',function(e){ if(e.target===this) closeModal(); });

/* ---------- ROUTER ---------- */
function go(v){ window.scrollTo(0,0); if(v==='home')renderHome(); else if(v==='dash')renderDash(); }
function openBatch(id){ curBatch=id; window.scrollTo(0,0); renderBatch(); }
function openModule(idx){ curModuleIdx=idx; window.scrollTo(0,0); renderModule(); }
renderHome();
</script>
</body>
</html>
